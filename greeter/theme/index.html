<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minecraft Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="title">

<!-- rotating panorama (CSS 3D cube) -->
<div id="scene"><div id="pitch"><div id="cube">
  <div class="face f0"></div><div class="face f1"></div><div class="face f2"></div>
  <div class="face f3"></div><div class="face f4"></div><div class="face f5"></div>
</div></div></div>
<div id="dirt"></div>
<div id="shade"></div>

<!-- TITLE SCREEN -->
<section id="title" class="screen active">
  <div id="logo-wrap">
    <img id="logo" src="assets/logo.png" alt="Minecraft">
    <div id="splash"></div>
  </div>
  <div id="menu">
    <button class="mc-btn" id="btn-login">Play</button>
    <button class="mc-btn" id="btn-switch">Switch Player</button>
    <button class="mc-btn" id="btn-session">Session</button>
    <div class="gap"></div>
    <div class="row">
      <button class="mc-btn" id="btn-restart">Restart</button>
      <button class="mc-btn" id="btn-quit">Quit Game</button>
    </div>
  </div>
  <div id="foot-l">Minecraft Desktop</div>
  <div id="foot-r"></div>
</section>

<!-- PASSWORD SCREEN ("Direct Connection" style) -->
<section id="login" class="screen">
  <h1>Direct Connection</h1>
  <div id="login-form">
    <div id="login-label">Password</div>
    <input id="pw" type="password" autocomplete="off" spellcheck="false">
    <div id="login-msg"></div>
    <div id="login-buttons">
      <button class="mc-btn" id="btn-join" disabled>Join Server</button>
      <button class="mc-btn" id="btn-cancel">Cancel</button>
    </div>
  </div>
</section>

<!-- USER LIST ("Select Server" style) -->
<section id="users" class="screen">
  <h1>Select Player</h1>
  <div id="user-list"></div>
  <div id="users-buttons"><button class="mc-btn" id="btn-users-cancel">Cancel</button></div>
</section>

<script src="js/splashes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
